
name: DocuMind Quota Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quota-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: quota_test
          POSTGRES_PASSWORD: quota_test_password
          POSTGRES_DB: documind_test

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U quota_test -d documind_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://quota_test:quota_test_password@localhost:5432/documind_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "psycopg[binary]==3.3.9"

      - name: Initialize test database
        run: |
          python -c "import os, psycopg; from pathlib import Path; conn = psycopg.connect(os.environ['TEST_DATABASE_URL']); conn.execute(Path('tests/quota_schema.sql').read_text()); conn.commit(); conn.close()"

      - name: Run quota concurrency tests
        run: python tests/test_quota_concurrency.py
